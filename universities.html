<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Universities · MyMentor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css" />
<style>
  .uni-search { width: 100%; padding: 13px 16px; border-radius: var(--radius-md); border: 1.5px solid var(--line-strong); font-size: 14px; background: var(--paper); }
  .uni-search:focus { outline: none; border-color: var(--brand-500); }
  .tier-block { margin-top: 32px; }
  .tier-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .tier-tag { font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 999px; background: var(--ink-100); color: var(--ink-700); }
  .tier-name { font-family: var(--font-display); font-size: 19px; color: var(--ink-950); }
  .uni-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
  .uni-card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 18px; transition: border-color .15s ease, box-shadow .15s ease; position: relative; }
  .uni-card:hover { border-color: var(--brand-500); box-shadow: var(--shadow-md); }
  .uni-card.oxbridge { background: var(--brand-100); border-color: var(--brand-500); }
  .uni-card h3 { font-size: 15.5px; margin-bottom: 6px; padding-right: 26px; }
  .uni-card p { font-size: 12.5px; color: var(--muted); line-height: 1.55; margin-bottom: 14px; min-height: 38px; }
  .uni-card-foot { display: flex; align-items: center; justify-content: space-between; }
  .uni-star { position: absolute; top: 16px; right: 16px; font-size: 17px; cursor: pointer; color: var(--line-strong); background: none; border: none; line-height: 1; }
  .uni-star.on { color: var(--brand-600); }
  .uni-no-results { display: none; text-align: center; padding: 40px; color: var(--muted); }
</style>
</head>
<body>

<div class="app-shell">
  <nav class="sidebar" id="mm-sidebar"></nav>

  <main class="main">
    <div class="page-eyebrow">Your shortlist starts here</div>
    <h1 class="page-title">Choose Your Universities</h1>
    <p class="page-sub">27 UK and Parcoursup universities, grouped by tier. Star the ones you're considering — your shortlist syncs straight to your dashboard.</p>

    <div class="card card-pad mt-24">
      <div class="between">
        <div class="small muted" style="font-weight:600;">SHORTLISTED</div>
        <div class="small" id="uni-shortlist-count" style="font-weight:700; color:var(--ink-950);">0 / 5 max</div>
      </div>
    </div>

    <input class="uni-search mt-24" id="uni-search" type="text" placeholder="Search universities..." />

    <div id="uni-container"></div>
    <div class="uni-no-results" id="uni-no-results">No universities found matching your search.</div>
  </main>
</div>

<script src="assets/js/app.js"></script>
<script src="assets/js/data/universities.js"></script>
<script>
  const user = MMApp.requireUser();

  if (user) {
    MMApp.renderSidebar('universities');

    let progress = MMApp.getProgress(user);
    let shortlist = progress.shortlist || [];

    function updateShortlistCount() {
      document.getElementById('uni-shortlist-count').textContent = `${shortlist.length} / 5 max`;
    }

    function toggleShortlist(id) {
      shortlist = shortlist.includes(id) ? shortlist.filter(x => x !== id) : [...shortlist, id];
      progress = MMApp.setProgress(user, { shortlist });
      updateShortlistCount();
      document.querySelectorAll(`.uni-star[data-id="${id}"]`).forEach(el => el.classList.toggle('on', shortlist.includes(id)));
    }

    function renderTier(tierKey) {
      const list = UNIVERSITIES[tierKey] || [];
      const meta = TIER_META[tierKey];
      return `
        <div class="tier-block" data-tier="${tierKey}">
          <div class="tier-head">
            <span class="tier-tag">${meta.badge} ${meta.label}</span>
          </div>
          <div class="uni-grid">
            ${list.map(u => `
              <div class="uni-card ${u.isOxbridge ? 'oxbridge' : ''}" data-name="${u.name.toLowerCase()}">
                <button class="uni-star ${shortlist.includes(u.id) ? 'on' : ''}" data-id="${u.id}" title="Add to shortlist">★</button>
                <h3>${u.name}</h3>
                <p>${u.description}</p>
                <div class="uni-card-foot">
                  <a class="btn btn-primary btn-sm" href="flyer.html?id=${u.id}">View profile →</a>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderAll() {
      document.getElementById('uni-container').innerHTML = ['tier1', 'tier2', 'tier3', 'parcoursup'].map(renderTier).join('');
      document.querySelectorAll('.uni-star').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          toggleShortlist(btn.dataset.id);
        });
      });
    }

    function filterCards() {
      const term = document.getElementById('uni-search').value.trim().toLowerCase();
      let anyVisible = false;
      document.querySelectorAll('.tier-block').forEach(block => {
        let tierHasVisible = false;
        block.querySelectorAll('.uni-card').forEach(card => {
          const match = card.dataset.name.includes(term);
          card.style.display = match ? '' : 'none';
          if (match) { tierHasVisible = true; anyVisible = true; }
        });
        block.style.display = tierHasVisible ? '' : 'none';
      });
      document.getElementById('uni-no-results').style.display = anyVisible ? 'none' : 'block';
    }

    renderAll();
    updateShortlistCount();
    document.getElementById('uni-search').addEventListener('input', filterCards);
  }
</script>
</body>
</html>
