<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UCAS Checklist · MyMentor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css" />
<style>
  .checklist-group { margin-top: 28px; }
  .group-title { font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-700); margin-bottom: 12px; }
  .check-item {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 16px 18px; border: 1px solid var(--line); border-radius: var(--radius-md);
    background: var(--paper); margin-bottom: 10px; cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .check-item:hover { border-color: var(--line-strong); }
  .check-item.done { background: var(--ok-bg); border-color: #bfe2cd; }
  .check-box {
    width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line-strong);
    flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: #fff; transition: all .15s ease;
  }
  .check-item.done .check-box { background: var(--ok); border-color: var(--ok); }
  .check-title { font-weight: 600; font-size: 15px; color: var(--ink-950); }
  .check-desc { font-size: 13.5px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
  .check-deadline { font-size: 12px; color: var(--brand-700); font-weight: 600; margin-top: 6px; }
</style>
</head>
<body>

<div class="app-shell">
  <nav class="sidebar" id="mm-sidebar"></nav>

  <main class="main">
    <div class="page-eyebrow">Application readiness</div>
    <h1 class="page-title">UCAS Checklist</h1>
    <p class="page-sub">Everything you need to have ready before, during and after your UCAS application — your full profile, documents, finances and next steps. Check items off as you complete them; your progress is saved automatically.</p>

    <div class="card card-pad mt-24">
      <div class="between">
        <div class="small muted" style="font-weight:600;">YOUR PROGRESS</div>
        <div class="small" id="cl-count" style="font-weight:700; color:var(--ink-950);">0 / 0</div>
      </div>
      <div class="progress-track mt-8">
        <div class="progress-fill" id="cl-fill" style="width:0%"></div>
      </div>
    </div>

    <div id="cl-groups"></div>
  </main>
</div>

<script src="assets/js/app.js"></script>
<script>
  const user = MMApp.requireUser();

  const CHECKLIST = [
    { group: 'Before you start', items: [
      { id: 'account', title: 'Create your UCAS Hub account', desc: 'Register at ucas.com — use an email you check daily; this is where all offers and decisions arrive.' },
      { id: 'fee-status', title: 'Confirm your fee status', desc: 'Work out whether you\'ll be classed as Home or International/Overseas for each university — it affects fees, visa requirements and sometimes entry criteria.' },
      { id: 'shortlist', title: 'Shortlist up to 5 universities', desc: 'UCAS allows a maximum of 5 choices. Balance 1–2 ambitious picks with realistic and safe options.', link: { href: 'universities.html', text: 'Browse universities' } },
      { id: 'entry-requirements', title: 'Check entry requirements per course', desc: 'Grades, required subjects and any extra criteria can differ a lot between universities offering the "same" course — check each one individually.' }
    ]},
    { group: 'Your profile & contact details', items: [
      { id: 'contact-details', title: 'Add your contact details & address', desc: 'Make sure your postal address, phone number and email on UCAS are accurate — this is how universities and UCAS reach you.' },
      { id: 'education-history', title: 'List your full education history', desc: 'Every school or college you\'ve attended since age 11, with start and end dates, entered accurately on your UCAS form.' },
      { id: 'employment-history', title: 'Add your employment history', desc: 'Part-time jobs, internships or work placements, with dates and a short description of what you did.' },
      { id: 'parent-details', title: 'Add parent/guardian or sponsor details', desc: 'Needed if you\'re under 18, or if a parent, guardian or sponsor is paying your fees or supporting a finance application.' }
    ]},
    { group: 'Your documents', items: [
      { id: 'ps', title: 'Draft your personal statement', desc: 'Answer the three current UCAS questions within the shared 4,000-character limit — see the workspace for word counts and submitting for review.', link: { href: 'personal-statement-guide.html', text: 'Open PS workspace' } },
      { id: 'reference', title: 'Request your academic reference', desc: 'Ask a teacher or counsellor early — references can take several weeks, especially near deadlines.' },
      { id: 'english-test', title: 'Book your English test', desc: 'IELTS, TOEFL or Cambridge — check each university\'s minimum score before booking.', link: { href: 'english-certifications-guide.html', text: 'English cert guide' } },
      { id: 'transcript', title: 'Gather transcripts & predicted grades', desc: 'Your school will submit predicted grades directly, but keep your own copies of past results.' },
      { id: 'photo', title: 'Prepare a passport-style photo', desc: 'Some universities and most student visa applications will ask for a recent, passport-style photo — sort this early so it doesn\'t hold anything up.' }
    ]},
    { group: 'Extra-curriculars & supporting evidence', items: [
      { id: 'activities', title: 'Record your work experience & extra-curriculars', desc: 'Note down anything relevant — volunteering, clubs, competitions, work experience — that supports your personal statement or shows relevant skills.' },
      { id: 'admissions-test', title: 'Check if your course needs an admissions test', desc: 'Some courses require a separate test — e.g. LNAT (Law), UCAT or BMAT (Medicine/Dentistry), TSA or MAT (Oxbridge). Book well ahead if so.' },
      { id: 'portfolio', title: 'Prepare a portfolio or audition material', desc: 'Required for some Art & Design, Music, Architecture and Drama courses — check each university\'s specific format and deadline.' }
    ]},
    { group: 'Finance', items: [
      { id: 'scholarships', title: 'Check scholarship eligibility', desc: 'Some scholarships (e.g. Chevening) have separate, earlier deadlines — start looking now.', link: { href: 'scholarships.html', text: 'Explore scholarships' } },
      { id: 'student-finance', title: 'Look into student finance or tuition fee loans', desc: 'Applications can take several weeks to process — start this as early as possible, even before you have final offers.' },
      { id: 'accommodation-cost', title: 'Research accommodation costs & options', desc: 'Compare university halls vs private accommodation, and note their application deadlines — some fill up fast.' }
    ]},
    { group: 'Before you submit', items: [
      { id: 'deadline', title: 'Confirm your deadline', desc: '15 October for Oxford, Cambridge and most medicine/dentistry courses; 25 January for the majority of programmes (incl. business, finance, economics, management).', deadline: 'Check per-course deadlines' },
      { id: 'proofread', title: 'Proofread and finalise your personal statement', desc: 'Check spelling, grammar, the character count, and that it reads in your own voice before you submit it.' },
      { id: 'review-form', title: 'Double-check every section of your UCAS form', desc: 'Personal details, education history, employment history, personal statement and reference — review the whole form before paying.' },
      { id: 'pay-fee', title: 'Pay the UCAS application fee', desc: 'A small one-off fee is required to submit your choices — have a card ready.' }
    ]},
    { group: 'After you submit', items: [
      { id: 'track-status', title: 'Track your application on UCAS Hub', desc: 'Universities update your status there as they make decisions — check it regularly rather than waiting for emails alone.' },
      { id: 'respond-offers', title: 'Respond to your offers', desc: 'Once decisions are in, choose your firm (first choice) and insurance (backup) offer by the UCAS deadline.' },
      { id: 'interview-prep', title: 'Prepare for interviews', desc: 'If a university invites you to interview, research typical questions for your subject and practise talking through your personal statement.' },
      { id: 'visa', title: 'Apply for a student visa', desc: 'International students should apply once they have a confirmed place — check processing times so you\'re not rushing close to the start of term.' },
      { id: 'results-day', title: 'Plan for results day', desc: 'Know exactly what grades your firm offer needs, and what your options are (including Clearing) if you don\'t quite meet them.' }
    ]}
  ];

  if (user) {
    MMApp.renderSidebar('ucas-checklist');

    let progress = MMApp.getProgress(user);
    let checklist = progress.checklist || {};

    const totalItems = CHECKLIST.reduce((n, g) => n + g.items.length, 0);

    function renderProgress() {
      const done = Object.values(checklist).filter(Boolean).length;
      document.getElementById('cl-count').textContent = `${done} / ${totalItems}`;
      document.getElementById('cl-fill').style.width = `${totalItems ? (done / totalItems) * 100 : 0}%`;
    }

    function renderGroups() {
      const container = document.getElementById('cl-groups');
      container.innerHTML = CHECKLIST.map(g => `
        <div class="checklist-group">
          <div class="group-title">${g.group}</div>
          ${g.items.map(item => `
            <div class="check-item ${checklist[item.id] ? 'done' : ''}" data-id="${item.id}">
              <div class="check-box">${checklist[item.id] ? '✓' : ''}</div>
              <div style="flex:1;">
                <div class="check-title">${item.title}</div>
                <div class="check-desc">${item.desc}</div>
                ${item.deadline ? `<div class="check-deadline">${item.deadline}</div>` : ''}
                ${item.link ? `<a href="${item.link.href}" class="small" style="color:var(--ink-800); font-weight:600; text-decoration:underline; display:inline-block; margin-top:8px;" onclick="event.stopPropagation()">${item.link.text} →</a>` : ''}
              </div>
            </div>
          `).join('')}
        </div>
      `).join('');

      container.querySelectorAll('.check-item').forEach(el => {
        el.addEventListener('click', () => {
          const id = el.dataset.id;
          checklist[id] = !checklist[id];
          progress = MMApp.setProgress(user, { checklist });
          renderGroups();
          renderProgress();
        });
      });
    }

    renderGroups();
    renderProgress();
  }
</script>
</body>
</html>
